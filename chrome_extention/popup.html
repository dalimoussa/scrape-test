<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bet365 Scraper Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 280px;
      padding: 16px;
      margin: 0;
      background: #0d1117;
      color: #f0f6fc;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      background: #238636;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    label {
      font-size: 12px;
      color: #8b949e;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #161b22;
      border: 1px solid #30363d;
      color: #f0f6fc;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus {
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      background: #238636;
      color: white;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      color: #8b949e;
    }
  </style>
</head>
<body>
  <h2>Bet365 Scraper <span class="badge">v2.0</span></h2>
  <label for="apiUrl">Backend API URL:</label>
  <input type="text" id="apiUrl" placeholder="http://127.0.0.1:8485/data" />
  <button id="saveBtn">Save URL</button>
  <div class="status" id="statusText">Forwarding Live & Pre-match frames</div>
  <script src="js/popup.js"></script>
</body>
</html>
